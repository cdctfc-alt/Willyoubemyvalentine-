<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #f7d5df;
            font-family: Arial, sans-serif;
        }

        .page {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px 15px;
            gap: 25px;
            overflow: hidden;
        }

        h1 {
            color: #b52d48;
            font-size: clamp(26px, 6vw, 40px);
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            max-width: 100%;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 22px;
            font-size: 18px;
            cursor: pointer;
            transition: font-size 0.25s ease;
        }

        .yes-button {
            background: #36ad49;
            color: white;
            font-size: 18px;
            z-index: 3;
        }

        .no-button {
            background: #e32636;
            color: white;
            font-size: 16px;
        }

        /* Cartoon Cat */

        .character {
            position: relative;
            width: 250px;
            height: 190px;
            animation: float 2s ease-in-out infinite;
        }

        .cat {
            position: absolute;
            width: 220px;
            height: 145px;
            left: 15px;
            bottom: 5px;
            background: #43bfd8;
            border: 4px solid #303030;
            border-radius: 48% 48% 35% 35%;
            overflow: hidden;
            z-index: 2;
        }

        .ear {
            position: absolute;
            top: 22px;
            width: 65px;
            height: 65px;
            background: #43bfd8;
            border: 4px solid #303030;
            border-radius: 10px;
            transform: rotate(45deg);
            z-index: 1;
        }

        .left-ear {
            left: 35px;
        }

        .right-ear {
            right: 35px;
        }

        .eyes {
            position: absolute;
            top: 42px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            color: #173e4b;
            font-size: 30px;
            font-weight: bold;
        }

        .mouth {
            position: absolute;
            top: 70px;
            width: 100%;
            color: #173e4b;
            font-size: 28px;
        }

        .belly {
            position: absolute;
            bottom: -38px;
            left: 50%;
            transform: translateX(-50%);
            width: 125px;
            height: 70px;
            background: white;
            border-radius: 50%;
        }

        /* Celebration Screen */

        #successPage {
            display: none;
            gap: 20px;
        }

        #successPage h1 {
            font-size: clamp(32px, 7vw, 55px);
        }

        #successPage p {
            color: #a52a45;
            font-size: 21px;
        }

        .heart {
            font-size: 100px;
            animation: heartbeat 1s infinite;
        }

        .back-button {
            background: #36ad49;
            color: white;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        /* Floating hearts */

        .floating-heart {
            position: fixed;
            bottom: -40px;
            font-size: 25px;
            pointer-events: none;
            animation: rise 4s linear forwards;
            z-index: 5;
        }

        @keyframes rise {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            to {
                transform: translateY(-110vh) rotate(30deg);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .character {
                transform: scale(0.9);
            }

            .page {
                gap: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- MAIN PAGE -->

    <main class="page" id="mainPage">

        <h1>Will You Be My Girlfriend? ❤️</h1>

        <div class="buttons">
            <button class="yes-button" id="yesButton">
                Yes 💚
            </button>

            <button class="no-button" id="noButton">
                No
            </button>
        </div>

        <!-- Cute Cartoon Cat -->

        <div class="character">

            <div class="ear left-ear"></div>
            <div class="ear right-ear"></div>

            <div class="cat">
                <div class="eyes">
                    <span>•</span>
                    <span>•</span>
                </div>

                <div class="mouth">ω</div>

                <div class="belly"></div>
            </div>

        </div>

    </main>

    <!-- YES / CELEBRATION PAGE -->

    <section class="page" id="successPage">

        <h1>YAYYYY! ❤️</h1>

        <p>You just made me the happiest person!</p>

        <div class="heart">💖</div>

        <p>Happy Valentine's Day! 💕</p>

        <button class="back-button" id="backButton">
            Go Back
        </button>

    </section>

    <script>
        const yesButton = document.getElementById("yesButton");
        const noButton = document.getElementById("noButton");
        const mainPage = document.getElementById("mainPage");
        const successPage = document.getElementById("successPage");
        const backButton = document.getElementById("backButton");

        const messages = [
            "Are you sure? 🥺",
            "Really sure? 💔",
            "Think again! 😭",
            "Please reconsider! 🥹",
            "Give me a chance! 💕",
            "Pretty please? 🌹",
            "Don't say no! 😿",
            "One more chance? 💖",
            "Are you positive? 🥺",
            "Please say yes! ❤️"
        ];

        let messageIndex = 0;
        let yesSize = 18;

        noButton.addEventListener("click", function () {
            noButton.textContent = messages[messageIndex];

            messageIndex = (messageIndex + 1) % messages.length;

            yesSize = Math.min(yesSize * 1.3, 100);

            yesButton.style.fontSize = yesSize + "px";
            yesButton.style.padding = "12px 22px";
        });

        yesButton.addEventListener("click", function () {
            mainPage.style.display = "none";
            successPage.style.display = "flex";

            createHearts();
        });

        backButton.addEventListener("click", function () {
            successPage.style.display = "none";
            mainPage.style.display = "flex";
        });

        function createHearts() {
            const emojis = ["❤️", "💕", "💖", "💗", "💘"];

            for (let i = 0; i < 25; i++) {
                setTimeout(function () {
                    const heart = document.createElement("div");

                    heart.className = "floating-heart";
                    heart.textContent =
                        emojis[Math.floor(Math.random() * emojis.length)];

                    heart.style.left = Math.random() * 100 + "vw";
                    heart.style.animationDuration =
                        (3 + Math.random() * 3) + "s";

                    document.body.appendChild(heart);

                    heart.addEventListener("animationend", function () {
                        heart.remove();
                    });
                }, i * 150);
            }
        }
    </script>

</body>
</html>
